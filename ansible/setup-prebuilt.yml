---
# Ansible playbook: Install R + proteomics pipeline deps via conda (no sudo needed)
#
# Strategy:
#   1. Install miniconda (if not present)
#   2. Create conda env with prebuilt R packages from conda-forge (~90% of deps)
#   3. Install 3 remaining Bioconductor packages via Rscript (clusterProfiler,
#      enrichplot, rrvgo — not on conda-forge, but small compile, deps already in env)
#
# No sudo required. Works on any Linux (Ubuntu, Debian, Fedora, etc).
# Total install time: ~10-15 min (downloads prebuilt binaries, minimal compilation).
#
# Prerequisites:
#   - Ansible 2.10+
#   - Internet connection
#   - ~3 GB free disk space
#
# Usage:
#   ansible-playbook ansible/setup-prebuilt.yml --connection=local
#
# After this completes:
#   conda activate r-proteomics
#   make check        # verify all packages
#   make test         # test on synthetic data
#   make all          # run full pipeline on real data

- name: Install R + proteomics packages via conda (no sudo)
  hosts: localhost
  connection: local

  vars:
    # Miniconda install location (user home, no sudo needed)
    miniconda_installer: "https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh"
    conda_dir: "{{ ansible_env.HOME }}/miniconda"
    conda_bin: "{{ ansible_env.HOME }}/miniconda/bin/conda"
    conda_env_name: "r-proteomics"
    r_version: "4.5"

    # R packages available as prebuilt conda-forge binaries
    conda_r_packages:
      # Core R
      - "r-base={{ r_version }}"
      - "r-devtools"
      # CRAN (prebuilt)
      - "r-ggplot2"
      - "r-ggrepel"
      - "r-scales"
      - "r-rcolorbrewer"
      - "r-ggvenndiagram"
      - "r-venndiagram"
      - "r-upsetr"
      - "r-dplyr"
      - "r-readr"
      - "r-tibble"
      - "r-tidyr"
      - "r-gprofiler2"
      - "r-config"
      - "r-here"
      - "r-stringr"
      - "r-patchwork"
      - "r-igraph"
      # Bioconductor (prebuilt on conda-forge)
      - "bioconductor-enhancedvolcano"
      - "bioconductor-org.hs.eg.db"
      - "bioconductor-dose"
      - "bioconductor-gosemsim"
      - "bioconductor-stringdb"
      - "bioconductor-complexheatmap"
      - "bioconductor-fgsea"
      - "bioconductor-ggtree"
      # System libraries (conda versions, no apt needed)
      - "r-xml"
      - "r-curl"
      - "r-openssl"
      - "r-cairo"
      - "r-png"
      - "r-jpeg"
      - "r-tiff"
      - "freetype"
      - "harfbuzz"
      - "fribidi"
      - "libgdal"
      - "libgeos"
      - "libproj"
      - "udunits2"
      - "glpk"
      - "gmp"
      - "mpfr"
      - "pandoc"
      - "make"
      - "git"

    # Bioconductor packages NOT on conda-forge — install via Rscript
    # These are small; their heavy deps (DOSE, GOSemSim, fgsea, ggtree)
    # are already installed via conda above, so compilation is fast.
    bioc_remaining:
      - "clusterProfiler"
      - "enrichplot"
      - "rrvgo"

  tasks:
    - name: Check if miniconda is already installed
      ansible.builtin.stat:
        path: "{{ conda_bin }}"
      register: conda_stat

    - name: Download miniconda installer
      ansible.builtin.get_url:
        url: "{{ miniconda_installer }}"
        dest: "/tmp/miniconda_installer.sh"
        mode: '0755'
      when: not conda_stat.stat.exists

    - name: Install miniconda (silent, user home)
      ansible.builtin.shell: |
        bash /tmp/miniconda_installer.sh -b -p {{ conda_dir }}
      args:
        creates: "{{ conda_bin }}"
      when: not conda_stat.stat.exists

    - name: Initialize conda for bash
      ansible.builtin.shell: |
        {{ conda_bin }} init bash
      when: not conda_stat.stat.exists
      changed_when: false

    - name: Create conda environment with R + prebuilt packages
      ansible.builtin.shell: |
        {{ conda_bin }} create -n {{ conda_env_name }} -c conda-forge -y \
          {{ conda_r_packages | map('quote') | join(' ') }}
      args:
        creates: "{{ ansible_env.HOME }}/miniconda/envs/{{ conda_env_name }}/bin/Rscript"
      environment:
        PATH: "{{ conda_dir }}/bin:{{ ansible_env.PATH }}"

    - name: Get Rscript path in conda env
      ansible.builtin.set_fact:
        rscript_bin: "{{ ansible_env.HOME }}/miniconda/envs/{{ conda_env_name }}/bin/Rscript"

    - name: Install remaining Bioconductor packages (clusterProfiler, enrichplot, rrvgo)
      ansible.builtin.shell: |
        {{ rscript_bin }} -e '
        options(repos = c(CRAN = "https://cloud.r-project.org"))
        options(timeout = 600)
        if (!requireNamespace("BiocManager", quietly = TRUE))
          install.packages("BiocManager")
        pkgs <- c({{ bioc_remaining | map("quote") | join(", ") }})
        for (p in pkgs) {
          if (requireNamespace(p, quietly = TRUE)) {
            cat(sprintf("  [SKIP] %s already installed\n", p))
            next
          }
          cat(sprintf("  [INSTALL] %s\n", p))
          BiocManager::install(p, update = FALSE, ask = FALSE)
        }
        failed <- c()
        for (p in pkgs) {
          if (!requireNamespace(p, quietly = TRUE)) failed <- c(failed, p)
        }
        if (length(failed) > 0) {
          cat("\n  [FAILED]:", paste(failed, collapse = ", "), "\n")
          quit(status = 1)
        } else {
          cat("\n  [SUCCESS] All", length(pkgs), "remaining packages installed\n")
        }
        '
      args:
        creates: "{{ ansible_env.HOME }}/miniconda/envs/{{ conda_env_name }}/lib/R/library/clusterProfiler"
      environment:
        PATH: "{{ conda_dir }}/bin:{{ ansible_env.PATH }}"
        MAKEFLAGS: "-j{{ ansible_processor_vcpu | default(2) }}"

    - name: Verify all R packages load
      ansible.builtin.shell: |
        {{ rscript_bin }} -e '
        pkgs <- c("ggplot2","ggrepel","scales","RColorBrewer","ggVennDiagram",
                  "VennDiagram","UpSetR","dplyr","readr","tibble","tidyr",
                  "gprofiler2","config","here","stringr","patchwork","igraph",
                  "clusterProfiler","enrichplot","DOSE","org.Hs.eg.db",
                  "STRINGdb","rrvgo","ComplexHeatmap","EnhancedVolcano")
        failed <- c()
        for (p in pkgs) {
          if (!requireNamespace(p, quietly = TRUE)) {
            cat(sprintf("  [FAIL] %s\n", p))
            failed <- c(failed, p)
          } else {
            cat(sprintf("  [OK]   %s %s\n", p, as.character(packageVersion(p))))
          }
        }
        if (length(failed) > 0) {
          cat("\n[FAILED]:", paste(failed, collapse = ", "), "\n")
          quit(status = 1)
        } else {
          cat("\n[SUCCESS] All", length(pkgs), "packages verified\n")
        }
        '
      register: r_verify
      changed_when: false
      environment:
        PATH: "{{ conda_dir }}/bin:{{ ansible_env.PATH }}"

    - name: Show verification results
      ansible.builtin.debug:
        msg: "{{ r_verify.stdout_lines }}"

  post_tasks:
    - name: Print next steps
      ansible.builtin.debug:
        msg:
          - "================================================"
          - " Setup complete! (conda prebuilt + Bioconductor)"
          - "================================================"
          - ""
          - "Conda env: {{ conda_env_name }}"
          - "Rscript:  {{ rscript_bin }}"
          - ""
          - "Next steps:"
          - "  1. source ~/.bashrc   (or restart terminal — activates conda)"
          - "  2. conda activate {{ conda_env_name }}"
          - "  3. cd proteomics-pipeline"
          - "  4. Copy CSV data files into data/ (CSV files)"
          - "  5. make check        (verify all packages)"
          - "  6. make test         (test on synthetic data)"
          - "  7. make all          (run full pipeline on real data)"