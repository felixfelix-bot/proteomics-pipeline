---
# Ansible playbook: Install R + proteomics pipeline deps via conda (no sudo needed)
#
# Strategy:
#   1. Install miniconda (if not present)
#   2. Create conda env with R base + compiler toolchain (no sudo needed)
#   3. Install ALL R packages via Rscript (BiocManager + install.packages)
#      inside the conda env — conda includes gcc/gfortran so packages
#      compile from source without needing system build deps.
#
# No sudo required. Works on any Linux (Ubuntu, Debian, Fedora, etc).
# Total install time: ~15-20 min (compiles R packages from source inside conda).
#
# Prerequisites:
#   - Ansible 2.10+
#   - Internet connection
#   - ~3 GB free disk space
#
# Usage:
#   ansible-playbook ansible/setup-prebuilt.yml --connection=local
#
# After this completes:
#   conda activate r-proteomics
#   make check        # verify all packages
#   make test         # test on synthetic data
#   make all          # run full pipeline on real data

- name: Install R + proteomics packages via conda (no sudo)
  hosts: localhost
  connection: local

  vars:
    miniconda_installer: "https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh"
    conda_dir: "{{ ansible_facts['env']['HOME'] }}/miniconda"
    conda_bin: "{{ ansible_facts['env']['HOME'] }}/miniconda/bin/conda"
    conda_env_name: "r-proteomics"

    # Conda packages: R base + compiler toolchain only.
    # All R packages installed via Rscript inside the env.
    conda_base_packages:
      - "r-base=4.5"
      - "r-devtools"
      - "gcc_linux-64"
      - "gxx_linux-64"
      - "gfortran_linux-64"
      - "make"
      - "pkg-config"
      # System libs needed by R packages (conda versions)
      - "libxml2"
      - "curl"
      - "openssl"
      - "freetype"
      - "harfbuzz"
      - "fribidi"
      - "libpng"
      - "libjpeg-turbo"
      - "libtiff"
      - "libgdal"
      - "libgeos"
      - "libproj"
      - "udunits2"
      - "glpk"
      - "gmp"
      - "mpfr"
      - "pandoc"
      - "git"

  tasks:
    - name: Check if miniconda is already installed
      ansible.builtin.stat:
        path: "{{ conda_bin }}"
      register: conda_stat

    - name: Download miniconda installer
      ansible.builtin.get_url:
        url: "{{ miniconda_installer }}"
        dest: "/tmp/miniconda_installer.sh"
        mode: '0755'
      when: not conda_stat.stat.exists

    - name: Install miniconda (silent, user home)
      ansible.builtin.shell: |
        bash /tmp/miniconda_installer.sh -b -p {{ conda_dir }}
      args:
        creates: "{{ conda_bin }}"
      when: not conda_stat.stat.exists

    - name: Initialize conda for bash
      ansible.builtin.shell: |
        {{ conda_bin }} init bash
      when: not conda_stat.stat.exists
      changed_when: false

    - name: Accept conda Terms of Service (required by newer conda)
      ansible.builtin.shell: |
        {{ conda_bin }} tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
        {{ conda_bin }} tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r
      changed_when: false

    - name: Create conda env with R base + compiler toolchain
      ansible.builtin.shell: |
        {{ conda_bin }} create -n {{ conda_env_name }} -c conda-forge -y \
          {{ conda_base_packages | map('quote') | join(' ') }}
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/miniconda/envs/{{ conda_env_name }}/bin/Rscript"
      environment:
        PATH: "{{ conda_dir }}/bin:{{ ansible_facts['env']['PATH'] }}"

    - name: Get Rscript path in conda env
      ansible.builtin.set_fact:
        rscript_bin: "{{ ansible_facts['env']['HOME'] }}/miniconda/envs/{{ conda_env_name }}/bin/Rscript"

    - name: Install ALL R packages via Rscript (CRAN + Bioconductor)
      ansible.builtin.shell: |
        {{ rscript_bin }} -e '
        options(repos = c(CRAN = "https://cloud.r-project.org"))
        options(timeout = 1200)
        if (!requireNamespace("BiocManager", quietly = TRUE))
          install.packages("BiocManager")
        cran_pkgs <- c(
          "ggplot2", "ggrepel", "scales", "RColorBrewer",
          "ggVennDiagram", "VennDiagram", "UpSetR",
          "dplyr", "readr", "tibble", "tidyr",
          "gprofiler2", "config", "here", "stringr", "patchwork",
          "igraph"
        )
        bioc_pkgs <- c(
          "EnhancedVolcano", "clusterProfiler", "enrichplot",
          "DOSE", "GOSemSim", "org.Hs.eg.db", "STRINGdb",
          "ComplexHeatmap", "rrvgo", "fgsea", "ggtree"
        )
        for (p in cran_pkgs) {
          if (!requireNamespace(p, quietly = TRUE)) {
            cat(sprintf("  [INSTALL] %s (CRAN)\n", p))
            install.packages(p)
          } else {
            cat(sprintf("  [SKIP] %s\n", p))
          }
        }
        for (p in bioc_pkgs) {
          if (!requireNamespace(p, quietly = TRUE)) {
            cat(sprintf("  [INSTALL] %s (Bioc)\n", p))
            BiocManager::install(p, update = FALSE, ask = FALSE)
          } else {
            cat(sprintf("  [SKIP] %s\n", p))
          }
        }
        failed <- c()
        all_pkgs <- c(cran_pkgs, bioc_pkgs)
        for (p in all_pkgs) {
          if (!requireNamespace(p, quietly = TRUE)) failed <- c(failed, p)
        }
        if (length(failed) > 0) {
          cat("\n  [FAILED]:", paste(failed, collapse = ", "), "\n")
          quit(status = 1)
        } else {
          cat("\n  [SUCCESS] All", length(all_pkgs), "packages installed\n")
        }
        '
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/miniconda/envs/{{ conda_env_name }}/lib/R/library/clusterProfiler"
      environment:
        PATH: "{{ conda_dir }}/envs/{{ conda_env_name }}/bin:{{ ansible_facts['env']['PATH'] }}"
        MAKEFLAGS: "-j{{ ansible_facts['processor_vcpu'] | default(2) }}"

    - name: Verify all R packages load
      ansible.builtin.shell: |
        {{ rscript_bin }} -e '
        pkgs <- c("ggplot2","ggrepel","scales","RColorBrewer","ggVennDiagram",
                  "VennDiagram","UpSetR","dplyr","readr","tibble","tidyr",
                  "gprofiler2","config","here","stringr","patchwork","igraph",
                  "clusterProfiler","enrichplot","DOSE","org.Hs.eg.db",
                  "STRINGdb","rrvgo","ComplexHeatmap","EnhancedVolcano")
        failed <- c()
        for (p in pkgs) {
          if (!requireNamespace(p, quietly = TRUE)) {
            cat(sprintf("  [FAIL] %s\n", p))
            failed <- c(failed, p)
          } else {
            cat(sprintf("  [OK]   %s %s\n", p, as.character(packageVersion(p))))
          }
        }
        if (length(failed) > 0) {
          cat("\n[FAILED]:", paste(failed, collapse = ", "), "\n")
          quit(status = 1)
        } else {
          cat("\n[SUCCESS] All", length(pkgs), "packages verified\n")
        }
        '
      register: r_verify
      changed_when: false
      environment:
        PATH: "{{ conda_dir }}/envs/{{ conda_env_name }}/bin:{{ ansible_facts['env']['PATH'] }}"

    - name: Show verification results
      ansible.builtin.debug:
        msg: "{{ r_verify.stdout_lines }}"

  post_tasks:
    - name: Print next steps
      ansible.builtin.debug:
        msg:
          - "================================================"
          - " Setup complete! (conda R + compiled packages)"
          - "================================================"
          - ""
          - "Conda env: {{ conda_env_name }}"
          - "Rscript:  {{ rscript_bin }}"
          - ""
          - "Next steps:"
          - "  1. source ~/.bashrc   (or restart terminal — activates conda)"
          - "  2. conda activate {{ conda_env_name }}"
          - "  3. cd proteomics-pipeline"
          - "  4. Copy CSV data files into data/ (CSV files)"
          - "  5. make check        (verify all packages)"
          - "  6. make test         (test on synthetic data)"
          - "  7. make all          (run full pipeline on real data)"