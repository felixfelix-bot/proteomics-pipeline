---
# Ansible inventory for proteomics pipeline
#
# Local machine (default):
#   ansible-playbook -i ansible/inventory.yml ansible/setup.yml --ask-become-pass
#
# Remote Ubuntu machine via SSH:
#   1. Edit ai-laptop ansible_host/ansible_user below
#   2. ansible-playbook -i ansible/inventory.yml ansible/setup.yml --ask-become-pass

all:
  children:
    linux_targets:
      hosts:
        ai-laptop:
          ansible_host: localhost
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
          # For remote SSH, change to:
          # ansible_host: 192.168.1.XXX
          # ansible_user: your-username
          # ansible_connection: ssh
          # ansible_python_interpreter: /usr/bin/python3

    # Windows targets removed — use bootstrap-windows-all.ps1 on Windows