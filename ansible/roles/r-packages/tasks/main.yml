---
# r-packages role: installs all R packages from R/00_install_packages.R
# Runs the install script directly from the cloned repo (no copying needed)
#
# Prerequisites: r-base role must have completed (R installed)

- name: Check if R/00_install_packages.R exists in repo
  stat:
    path: "{{ playbook_dir }}/../R/00_install_packages.R"
  register: install_script

- name: Fail if install script not found
  fail:
    msg: "R/00_install_packages.R not found. Clone the repo first: git clone <repo-url>"
  when: not install_script.stat.exists

- name: Install R packages via Rscript
  command: "Rscript {{ playbook_dir }}/../R/00_install_packages.R"
  register: r_package_install
  changed_when: "'INSTALLING' in r_package_install.stdout or 'New packages' in r_package_install.stdout"
  environment:
    R_DOWNLOAD_METHOD: curl

- name: Show install result (last 10 lines)
  debug:
    msg: "{{ r_package_install.stdout_lines[-10:] }}"